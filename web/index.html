<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RINDA · Vector Habitat Intelligence</title>
<meta name="description" content="Forecast-to-flight operations console for larval source management">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f1a24'/%3E%3Ccircle cx='16' cy='16' r='9.5' fill='none' stroke='%2336c2a6' stroke-width='2'/%3E%3Cpath d='M16 9.5c2.8 3.6 4.2 6 4.2 7.8a4.2 4.2 0 0 1-8.4 0c0-1.8 1.4-4.2 4.2-7.8z' fill='%23f0a63a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/css/app.css">
<script>
  try { const t = localStorage.getItem('rinda.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div id="boot" class="boot">
  <div class="boot-mark">
    <svg viewBox="0 0 48 48" width="56" height="56" aria-hidden="true"><circle cx="24" cy="24" r="15" fill="none" stroke="var(--brand)" stroke-width="2.5"/><path d="M24 14c4.4 5.6 6.6 9.4 6.6 12.2a6.6 6.6 0 0 1-13.2 0c0-2.8 2.2-6.6 6.6-12.2z" fill="var(--signal)"/><path d="M24 3v6M24 39v6M3 24h6M39 24h6" stroke="var(--brand)" stroke-width="2.5" stroke-linecap="round"/></svg>
    <div><div class="boot-word">RINDA</div><div class="boot-sub">Vector Habitat Intelligence</div></div>
  </div>
  <div class="boot-bar"><span></span></div>
  <div class="boot-msg" id="bootMsg">Connecting to forecast engine</div>
</div>

<div class="shell" id="shell" hidden>
  <aside class="nav" id="nav">
    <a class="brand" href="#/overview" aria-label="RINDA home">
      <svg viewBox="0 0 48 48" width="30" height="30" aria-hidden="true"><circle cx="24" cy="24" r="15" fill="none" stroke="var(--brand)" stroke-width="3"/><path d="M24 14c4.4 5.6 6.6 9.4 6.6 12.2a6.6 6.6 0 0 1-13.2 0c0-2.8 2.2-6.6 6.6-12.2z" fill="var(--signal)"/><path d="M24 3v6M24 39v6M3 24h6M39 24h6" stroke="var(--brand)" stroke-width="3" stroke-linecap="round"/></svg>
      <span><b>RINDA</b><small>Vector Habitat Intelligence</small></span>
    </a>
    <div class="tenant">
      <label for="tenant">Operating area</label>
      <select id="tenant">
        <option>Gikomero Sector · Gasabo</option>
        <option disabled>Rwamagana · not onboarded</option>
        <option disabled>Bugesera · not onboarded</option>
        <option disabled>Nyagatare · not onboarded</option>
      </select>
    </div>
    <nav id="navlinks"></nav>
    <div class="nav-foot">
      <a href="/api/docs" target="_blank" rel="noopener">API reference</a>
      <span id="buildTag" class="mono"></span>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <button class="icon-btn only-mobile" id="navToggle" aria-label="Open navigation"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="crumbs"><span id="crumbGroup"></span><svg viewBox="0 0 24 24" class="chev"><path d="M9 6l6 6-6 6"/></svg><b id="crumbView"></b></div>
      <div class="top-controls">
        <div class="seg" role="group" aria-label="Forecast horizon" id="hSeg">
          <button data-h="7" aria-pressed="true">7-day</button><button data-h="14" aria-pressed="false">14-day</button>
        </div>
        <div class="datepick">
          <button class="icon-btn" id="datePrev" aria-label="Previous issue"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
          <select id="dateSel" aria-label="Forecast issue date"></select>
          <button class="icon-btn" id="dateNext" aria-label="Next issue"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
        <span class="chip mode" id="modeChip" title="No numerical weather forecast feed is connected. Forecasts replay the archive exactly as they would have been issued."><i></i>Hindcast replay</span>
        <div class="top-sep"></div>
        <span class="clock mono" id="clock" title="Kigali time (CAT, UTC+2)"></span>
        <select id="roleSel" class="role" aria-label="Signed-in role">
          <option value="pm">Programme Manager</option>
          <option value="dvco">District Vector Control</option>
          <option value="pilot">Drone Operations</option>
          <option value="analyst">Data Analyst</option>
        </select>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle light or dark theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></button>
      </div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>

<div id="drawer" class="drawer" aria-hidden="true"><div class="drawer-scrim" data-close></div><section class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"><header><h2 id="drawerTitle"></h2><button class="icon-btn" data-close aria-label="Close panel"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header><div class="drawer-body" id="drawerBody"></div></section></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/vendor/echarts.min.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
